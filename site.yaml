nombre: La Huerta de Abril
eslogan: Casa rural con huerta y castaños en Hervás, Valle del Ambroz.
sector: casa-rural
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = nombre en texto.
colores:
  primario: "#2f4a3a"
  acento: "#95542e"
  fondo: "#f6f1e7"
  texto: "#262a24"
contacto:
  telefono: "927 47 30 66"
  email: hola@lahuertadeabril.es
  direccion: Camino de la Fuente Chiquita 6, 10700 Hervás (Cáceres)
  horario: "Llegadas de 16:00 a 21:00. Salidas hasta las 12:00. Te atendemos por teléfono de 9:00 a 21:00."
  whatsapp: "+34 622 47 30 66"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
